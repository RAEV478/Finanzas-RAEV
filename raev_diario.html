<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f8f4">
<title>RAEV · Diario</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #f6f8f4;
  --surface:   #ffffff;
  --surface2:  #eaf2e7;
  --border:    rgba(31,64,45,0.10);
  --shadow:    0 2px 14px rgba(31,64,45,0.06);
  --text:      #1e2c22;
  --muted:     #6d7d70;
  --muted2:    #9aa89c;
  --green:     #3e8e63;
  --green-deep:#2c6b48;
  --coral:     #a8433b;
  --gold:      #c08e2e;
  --font-head: 'DM Serif Display', serif;
  --font-body: 'Outfit', sans-serif;
  --font-mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 70% 40% at 15% 0%, rgba(62,142,99,0.10) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 90% 10%, rgba(192,142,46,0.06) 0%, transparent 50%);
  pointer-events: none;
}
#app { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 0 0 110px; min-height: 100vh; }

/* Header */
.header {
  padding: 44px 20px 18px;
  position: sticky; top: 0; z-index: 50;
  background: linear-gradient(180deg, rgba(246,248,244,0.98) 0%, rgba(246,248,244,0.93) 100%);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.brand { font-family: var(--font-head); font-size: 22px; letter-spacing: 0.3px; color: var(--green-deep); }
.brand span { color: var(--muted2); font-family: var(--font-body); font-weight: 300; }
.month-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
.month-nav { display: flex; align-items: center; gap: 14px; }
.month-btn {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); display: flex; align-items: center; justify-content: center;
  font-size: 15px; cursor: pointer; user-select: none; transition: background 0.15s; box-shadow: var(--shadow);
}
.month-btn:active { background: var(--surface2); }
.month-label { font-family: var(--font-mono); font-size: 14px; color: var(--text); text-transform: capitalize; min-width: 108px; text-align: center; }
.today-pill {
  font-size: 11px; color: var(--green-deep); background: var(--surface2); border: 1px solid var(--border);
  padding: 5px 10px; border-radius: 20px; cursor: pointer;
}

/* KPI cards */
.kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 18px 20px 4px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 12px; box-shadow: var(--shadow); }
.kpi-label { font-size: 10.5px; color: var(--muted); margin-bottom: 6px; }
.kpi-val { font-family: var(--font-mono); font-size: 15px; letter-spacing: -0.3px; }
.kpi-val.pos { color: var(--green); }
.kpi-val.neg { color: var(--coral); }
.kpi-val.neutral { color: var(--text); }

/* Section titles */
.sec-title {
  padding: 22px 20px 10px; font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: space-between;
}
.sec-title b { color: var(--text); font-weight: 500; }
.toggle-cat {
  font-size: 11.5px; color: var(--gold); cursor: pointer; user-select: none;
}

/* Category breakdown */
.cat-breakdown { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
.cat-row { display: flex; flex-direction: column; gap: 5px; }
.cat-row-top { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
.cat-row-name { display: flex; align-items: center; gap: 7px; color: var(--text); }
.cat-row-amt { font-family: var(--font-mono); color: var(--muted); }
.cat-bar-track { height: 5px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.cat-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--green), var(--gold)); }
.empty-note { padding: 0 20px; font-size: 12.5px; color: var(--muted2); }

/* Entries list */
.day-group { padding: 0 20px; margin-top: 18px; }
.day-header { font-size: 11.5px; color: var(--muted2); margin-bottom: 8px; text-transform: capitalize; display: flex; justify-content: space-between; }
.entry {
  display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 13px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s; box-shadow: var(--shadow);
}
.entry:active { background: var(--surface2); }
.entry-icon {
  width: 38px; height: 38px; border-radius: 11px; background: var(--surface2); display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.entry-mid { flex: 1; min-width: 0; }
.entry-cat { font-size: 13.5px; color: var(--text); }
.entry-note { font-size: 11.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-amt { font-family: var(--font-mono); font-size: 14.5px; flex-shrink: 0; }
.entry-amt.gasto { color: var(--coral); }
.entry-amt.ingreso { color: var(--green); }

.empty-state { padding: 60px 30px; text-align: center; color: var(--muted2); }
.empty-state div:first-child { font-size: 34px; margin-bottom: 12px; }
.empty-state p { font-size: 13px; line-height: 1.5; }

/* FAB */
.fab {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  width: 58px; height: 58px; border-radius: 50%;
  background: linear-gradient(135deg, var(--green), var(--green-deep));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 24px rgba(44,107,72,0.32);
  font-size: 26px; color: #f4faf6; cursor: pointer; z-index: 60; border: none;
  transition: transform 0.15s;
}
.fab:active { transform: translateX(-50%) scale(0.93); }

/* Sheet modal */
.sheet-overlay {
  position: fixed; inset: 0; background: rgba(20,35,25,0.42); z-index: 100; opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.sheet-overlay.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 101; max-width: 460px; margin: 0 auto;
  background: var(--surface); border-radius: 22px 22px 0 0; border: 1px solid var(--border); border-bottom: none;
  padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform 0.3s cubic-bezier(.32,.72,0,1);
  max-height: 88vh; overflow-y: auto; box-shadow: 0 -8px 30px rgba(31,64,45,0.12);
}
.sheet.open { transform: translateY(0); }
.sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 3px; margin: 0 auto 16px; }
.sheet-title { font-family: var(--font-head); font-size: 19px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; color: var(--green-deep); }
.sheet-close { color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px; }

.type-toggle { display: flex; background: var(--surface2); border-radius: 12px; padding: 3px; margin-bottom: 18px; }
.type-btn { flex: 1; text-align: center; padding: 9px; border-radius: 9px; font-size: 13.5px; color: var(--muted); cursor: pointer; transition: all 0.15s; }
.type-btn.active.gasto { background: var(--coral); color: #fdf3f1; font-weight: 500; }
.type-btn.active.ingreso { background: var(--green); color: #f4faf6; font-weight: 500; }

.amount-input-wrap { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin-bottom: 22px; }
.amount-currency { font-family: var(--font-mono); font-size: 20px; color: var(--muted); }
.amount-input {
  font-family: var(--font-mono); font-size: 40px; background: none; border: none; color: var(--text);
  width: 200px; text-align: center; outline: none;
}
.amount-input::placeholder { color: var(--muted2); }

.field-label { font-size: 11.5px; color: var(--muted); margin: 0 0 9px 2px; }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
.method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.method-grid .cat-chip .lb { font-size: 10px; }
.other-method-input { margin-top: -8px; }
.cat-chip {
  display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px;
  background: var(--surface2); border: 1px solid transparent; border-radius: 13px; cursor: pointer; transition: all 0.15s;
}
.cat-chip .em { font-size: 19px; }
.cat-chip .lb { font-size: 9.5px; color: var(--muted); text-align: center; line-height: 1.2; }
.cat-chip.selected { border-color: var(--green); background: rgba(62,142,99,0.12); }
.cat-chip.selected .lb { color: var(--green-deep); }

.text-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; color: var(--text); font-family: var(--font-body); font-size: 14px; outline: none; margin-bottom: 18px;
}
.text-input:focus { border-color: var(--green); }
.date-input { color-scheme: light; }

.save-btn {
  width: 100%; padding: 15px; border-radius: 14px; border: none; font-family: var(--font-body); font-weight: 500;
  font-size: 14.5px; cursor: pointer; background: var(--green); color: #f4faf6; transition: transform 0.1s;
}
.save-btn:active { transform: scale(0.98); }
.save-btn.disabled { background: var(--surface2); color: var(--muted2); pointer-events: none; }
.delete-btn {
  width: 100%; padding: 13px; border-radius: 14px; border: 1px solid rgba(168,67,59,0.28); background: transparent;
  color: var(--coral); font-family: var(--font-body); font-size: 13.5px; cursor: pointer; margin-top: 10px;
}

.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px); z-index: 200;
  background: var(--green-deep); color: #f4faf6; padding: 10px 18px; border-radius: 30px;
  font-size: 12.5px; opacity: 0; pointer-events: none; transition: all 0.25s; box-shadow: 0 6px 18px rgba(31,64,45,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <div id="storage-banner" style="display:none; font-size:11.5px; padding:8px 12px; border-radius:10px; margin-bottom:10px;"></div>
    <div class="brand">RAEV <span>· Diario</span></div>
    <div class="month-row">
      <div class="month-nav">
        <div class="month-btn" onclick="shiftMonth(-1)">‹</div>
        <div class="month-label" id="month-label">—</div>
        <div class="month-btn" onclick="shiftMonth(1)">›</div>
      </div>
      <div class="today-pill" onclick="goToday()">hoy</div>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi">
      <div class="kpi-label">Ingresos</div>
      <div class="kpi-val pos" id="kpi-ingresos">$0</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Gastos</div>
      <div class="kpi-val neg" id="kpi-gastos">$0</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Flujo real</div>
      <div class="kpi-val neutral" id="kpi-flujo">$0</div>
    </div>
  </div>

  <div class="sec-title">
    <span>Por categoría <b id="cat-total"></b></span>
    <span class="toggle-cat" id="cat-toggle" onclick="toggleCatView()">gastos</span>
  </div>
  <div class="cat-breakdown" id="cat-breakdown"></div>

  <div id="entries-container"></div>
</div>

<button class="fab" onclick="openSheet()">+</button>

<div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">
    <span id="sheet-heading">Nuevo registro</span>
    <span class="sheet-close" onclick="closeSheet()">✕</span>
  </div>

  <div class="type-toggle">
    <div class="type-btn gasto active" id="btn-gasto" onclick="setType('gasto')">Gasto</div>
    <div class="type-btn ingreso" id="btn-ingreso" onclick="setType('ingreso')">Ingreso</div>
  </div>

  <div class="amount-input-wrap">
    <span class="amount-currency">$</span>
    <input class="amount-input" id="input-amount" type="number" inputmode="decimal" placeholder="0" step="0.01">
  </div>

  <div class="field-label">Categoría</div>
  <div class="cat-grid" id="cat-grid"></div>

  <div class="field-label" id="method-label">¿Cómo pagaste?</div>
  <div class="method-grid" id="method-grid"></div>
  <input class="text-input other-method-input" id="input-method-other" type="text" placeholder="especifica..." style="display:none">

  <div class="field-label">Nota (opcional)</div>
  <input class="text-input" id="input-note" type="text" placeholder="ej. café con Ana, gasolina...">

  <div class="field-label">Fecha</div>
  <input class="text-input date-input" id="input-date" type="date">

  <button class="save-btn disabled" id="save-btn" onclick="saveEntry()">Guardar</button>
  <button class="delete-btn" id="delete-btn" style="display:none" onclick="deleteEntry()">Eliminar registro</button>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS = {
  gasto: [
    { id: 'cafe', em: '☕', lb: 'Café' },
    { id: 'comida', em: '🍽️', lb: 'Comida' },
    { id: 'super', em: '🛒', lb: 'Súper' },
    { id: 'gasolina', em: '⛽', lb: 'Gasolina' },
    { id: 'ocio', em: '🎬', lb: 'Ocio' },
    { id: 'salidas', em: '🍸', lb: 'Salidas' },
    { id: 'viajes', em: '✈️', lb: 'Viajes' },
    { id: 'salud', em: '💊', lb: 'Salud' },
    { id: 'hogar', em: '🏠', lb: 'Hogar' },
    { id: 'ninas', em: '🎈', lb: 'Niñas' },
    { id: 'regalos', em: '🎁', lb: 'Regalos' },
    { id: 'otros_g', em: '📎', lb: 'Otros' },
  ],
  ingreso: [
    { id: 'sueldo', em: '💼', lb: 'Sueldo' },
    { id: 'comisiones', em: '📈', lb: 'Comisiones' },
    { id: 'dividendos', em: '💰', lb: 'Dividendos' },
    { id: 'otros_i', em: '🔖', lb: 'Otros' },
  ]
};
const CAT_MAP = {};
[...CATS.gasto, ...CATS.ingreso].forEach(c => CAT_MAP[c.id] = c);

const METHODS = {
  gasto: [
    { id: 'efectivo', em: '💵', lb: 'Efectivo' },
    { id: 'debito', em: '🏦', lb: 'Débito' },
    { id: 'tdc_we', em: '💳', lb: 'TDC HSBC WE' },
    { id: 'tdc_invex', em: '💳', lb: 'TDC INVEX' },
    { id: 'tdc_oro', em: '💳', lb: 'TDC HSBC ORO' },
    { id: 'transferencia', em: '🔁', lb: 'Transferencia' },
    { id: 'otro', em: '📝', lb: 'Otro' },
  ],
  ingreso: [
    { id: 'transferencia', em: '🔁', lb: 'Transferencia' },
    { id: 'deposito', em: '🏦', lb: 'Depósito' },
    { id: 'efectivo', em: '💵', lb: 'Efectivo' },
    { id: 'otro', em: '📝', lb: 'Otro' },
  ]
};

const STORAGE_KEY = 'diario-entries-v1';
let entries = [];
let activeMonth = new Date().toISOString().slice(0,7); // YYYY-MM
let currentType = 'gasto';
let selectedCat = null;
let selectedMethod = null;
let editingId = null;
let catView = 'gasto';

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmt = n => '$' + Math.round(n).toLocaleString('es-MX');

function showBanner(msg, kind) {
  const b = document.getElementById('storage-banner');
  b.textContent = msg;
  b.style.display = 'block';
  b.style.background = kind === 'error' ? 'rgba(168,67,59,0.12)' : 'rgba(62,142,99,0.12)';
  b.style.color = kind === 'error' ? 'var(--coral)' : 'var(--green-deep)';
  b.style.border = '1px solid ' + (kind === 'error' ? 'rgba(168,67,59,0.3)' : 'rgba(62,142,99,0.3)');
}
function hideBanner() {
  document.getElementById('storage-banner').style.display = 'none';
}

function showBanner(msg, kind) {
  const b = document.getElementById('storage-banner');
  b.textContent = msg;
  b.style.display = 'block';
  b.style.background = kind === 'error' ? 'rgba(168,67,59,0.12)' : 'rgba(62,142,99,0.12)';
  b.style.color = kind === 'error' ? 'var(--coral)' : 'var(--green-deep)';
  b.style.border = '1px solid ' + (kind === 'error' ? 'rgba(168,67,59,0.3)' : 'rgba(62,142,99,0.3)');
}
function hideBanner() {
  document.getElementById('storage-banner').style.display = 'none';
}

async function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
    hideBanner();
  } catch (e) {
    entries = [];
    showBanner('⚠ Este navegador no permite guardar datos aquí (modo privado / restricción del dispositivo). Lo capturado no se conservará al cerrar.', 'error');
  }
  render();
}

async function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    hideBanner();
    return true;
  } catch (e) {
    showBanner('⚠ No se pudo guardar (' + (e && e.message ? e.message : 'error desconocido') + '). Este registro se perderá al cerrar.', 'error');
    return false;
  }
}

function monthLabel(ym) {
  const [y,m] = ym.split('-').map(Number);
  return MESES[m-1] + ' ' + y;
}
function shiftMonth(dir) {
  const [y,m] = activeMonth.split('-').map(Number);
  const d = new Date(y, m-1+dir, 1);
  activeMonth = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  render();
}
function goToday() {
  activeMonth = new Date().toISOString().slice(0,7);
  render();
}

function entriesForMonth() {
  return entries.filter(e => e.date.slice(0,7) === activeMonth);
}

function render() {
  document.getElementById('month-label').textContent = monthLabel(activeMonth);
  const monthEntries = entriesForMonth();
  const ingresos = monthEntries.filter(e => e.type === 'ingreso').reduce((s,e) => s+e.amount, 0);
  const gastos = monthEntries.filter(e => e.type === 'gasto').reduce((s,e) => s+e.amount, 0);
  document.getElementById('kpi-ingresos').textContent = fmt(ingresos);
  document.getElementById('kpi-gastos').textContent = fmt(gastos);
  const flujoEl = document.getElementById('kpi-flujo');
  flujoEl.textContent = fmt(ingresos - gastos);
  flujoEl.className = 'kpi-val ' + (ingresos - gastos >= 0 ? 'pos' : 'neg');

  renderCategoryBreakdown(monthEntries);
  renderEntries(monthEntries);
}

function toggleCatView() {
  catView = catView === 'gasto' ? 'ingreso' : 'gasto';
  document.getElementById('cat-toggle').textContent = catView === 'gasto' ? 'gastos' : 'ingresos';
  render();
}

function renderCategoryBreakdown(monthEntries) {
  const filtered = monthEntries.filter(e => e.type === catView);
  const totals = {};
  filtered.forEach(e => { totals[e.category] = (totals[e.category]||0) + e.amount; });
  const rows = Object.entries(totals).sort((a,b) => b[1]-a[1]);
  const total = rows.reduce((s,[,v]) => s+v, 0);
  document.getElementById('cat-total').textContent = rows.length ? fmt(total) : '';
  const el = document.getElementById('cat-breakdown');
  if (!rows.length) {
    el.innerHTML = '<div class="empty-note">Sin ' + (catView==='gasto'?'gastos':'ingresos') + ' registrados este mes.</div>';
    return;
  }
  const max = rows[0][1];
  el.innerHTML = rows.map(([catId, amt]) => {
    const cat = CAT_MAP[catId] || { em:'📎', lb: catId };
    const pct = Math.max(6, Math.round(amt/max*100));
    return `<div class="cat-row">
      <div class="cat-row-top">
        <div class="cat-row-name">${cat.em} ${cat.lb}</div>
        <div class="cat-row-amt">${fmt(amt)}</div>
      </div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function renderEntries(monthEntries) {
  const el = document.getElementById('entries-container');
  if (!monthEntries.length) {
    el.innerHTML = `<div class="empty-state"><div>🗒️</div><p>Todavía no hay registros este mes.<br>Toca el botón + para capturar tu primer gasto o ingreso.</p></div>`;
    return;
  }
  const byDay = {};
  monthEntries.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const days = Object.keys(byDay).sort().reverse();
  el.innerHTML = days.map(day => {
    const dayEntries = byDay[day].sort((a,b) => (b.ts||0)-(a.ts||0));
    const dayTotal = dayEntries.reduce((s,e) => s + (e.type==='ingreso'?e.amount:-e.amount), 0);
    const d = new Date(day + 'T00:00:00');
    const dayLabel = d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'short' });
    return `<div class="day-group">
      <div class="day-header"><span>${dayLabel}</span><span>${fmt(Math.abs(dayTotal))}</span></div>
      ${dayEntries.map(e => {
        const cat = CAT_MAP[e.category] || { em:'📎', lb: e.category };
        return `<div class="entry" onclick="openEdit('${e.id}')">
          <div class="entry-icon">${cat.em}</div>
          <div class="entry-mid">
            <div class="entry-cat">${cat.lb}${e.method ? ' · ' + escapeHtml(e.method) : ''}</div>
            ${e.note ? `<div class="entry-note">${escapeHtml(e.note)}</div>` : ''}
          </div>
          <div class="entry-amt ${e.type}">${e.type==='gasto'?'-':'+'}${fmt(e.amount)}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function renderCatGrid() {
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = CATS[currentType].map(c => `
    <div class="cat-chip ${selectedCat===c.id?'selected':''}" onclick="selectCat('${c.id}')">
      <div class="em">${c.em}</div>
      <div class="lb">${c.lb}</div>
    </div>
  `).join('');
}
function selectCat(id) { selectedCat = id; renderCatGrid(); validateForm(); }

function renderMethodGrid() {
  document.getElementById('method-label').textContent = currentType === 'gasto' ? '¿Cómo pagaste?' : '¿Cómo lo recibiste?';
  const grid = document.getElementById('method-grid');
  grid.innerHTML = METHODS[currentType].map(m => `
    <div class="cat-chip ${selectedMethod===m.id?'selected':''}" onclick="selectMethod('${m.id}')">
      <div class="em">${m.em}</div>
      <div class="lb">${m.lb}</div>
    </div>
  `).join('');
  const otherInput = document.getElementById('input-method-other');
  otherInput.style.display = selectedMethod === 'otro' ? 'block' : 'none';
}
function selectMethod(id) { selectedMethod = id; renderMethodGrid(); validateForm(); }

function setType(type) {
  currentType = type;
  selectedCat = null;
  selectedMethod = null;
  document.getElementById('btn-gasto').classList.toggle('active', type==='gasto');
  document.getElementById('btn-ingreso').classList.toggle('active', type==='ingreso');
  renderCatGrid();
  renderMethodGrid();
  validateForm();
}

function validateForm() {
  const amt = parseFloat(document.getElementById('input-amount').value);
  const methodOk = selectedMethod && (selectedMethod !== 'otro' || document.getElementById('input-method-other').value.trim());
  const ok = amt > 0 && selectedCat && methodOk;
  document.getElementById('save-btn').classList.toggle('disabled', !ok);
}
document.getElementById('input-method-other').addEventListener('input', validateForm);
document.getElementById('input-amount').addEventListener('input', validateForm);

function openSheet(prefillDate) {
  editingId = null;
  currentType = 'gasto'; selectedCat = null; selectedMethod = null;
  document.getElementById('sheet-heading').textContent = 'Nuevo registro';
  document.getElementById('btn-gasto').classList.add('active');
  document.getElementById('btn-ingreso').classList.remove('active');
  document.getElementById('input-amount').value = '';
  document.getElementById('input-note').value = '';
  document.getElementById('input-method-other').value = '';
  document.getElementById('input-date').value = prefillDate || new Date().toISOString().slice(0,10);
  document.getElementById('delete-btn').style.display = 'none';
  renderCatGrid();
  renderMethodGrid();
  validateForm();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
function openEdit(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  currentType = e.type; selectedCat = e.category;
  const preset = (METHODS[e.type] || []).find(m => m.lb === e.method);
  document.getElementById('input-method-other').value = '';
  if (preset) {
    selectedMethod = preset.id;
  } else if (e.method) {
    selectedMethod = 'otro';
    document.getElementById('input-method-other').value = e.method;
  } else {
    selectedMethod = null;
  }
  document.getElementById('sheet-heading').textContent = 'Editar registro';
  document.getElementById('btn-gasto').classList.toggle('active', e.type==='gasto');
  document.getElementById('btn-ingreso').classList.toggle('active', e.type==='ingreso');
  document.getElementById('input-amount').value = e.amount;
  document.getElementById('input-note').value = e.note || '';
  document.getElementById('input-date').value = e.date;
  document.getElementById('delete-btn').style.display = 'block';
  renderCatGrid();
  renderMethodGrid();
  validateForm();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

async function saveEntry() {
  const amount = parseFloat(document.getElementById('input-amount').value);
  const note = document.getElementById('input-note').value.trim();
  const date = document.getElementById('input-date').value || new Date().toISOString().slice(0,10);
  if (!(amount > 0) || !selectedCat || !selectedMethod) return;

  const methodPreset = (METHODS[currentType] || []).find(m => m.id === selectedMethod);
  const method = selectedMethod === 'otro'
    ? document.getElementById('input-method-other').value.trim()
    : (methodPreset ? methodPreset.lb : '');
  if (!method) return;

  if (editingId) {
    const idx = entries.findIndex(e => e.id === editingId);
    if (idx > -1) entries[idx] = { ...entries[idx], type: currentType, amount, category: selectedCat, note, date, method };
  } else {
    entries.push({ id: 'e' + Date.now() + Math.random().toString(36).slice(2,7), type: currentType, amount, category: selectedCat, note, date, method, ts: Date.now() });
  }
  const ok = await persist();
  activeMonth = date.slice(0,7);
  closeSheet();
  render();
  if (ok) showToast(editingId ? 'Registro actualizado' : 'Guardado');
}

async function deleteEntry() {
  if (!editingId) return;
  entries = entries.filter(e => e.id !== editingId);
  const ok = await persist();
  closeSheet();
  render();
  if (ok) showToast('Registro eliminado');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

loadEntries();
</script>
</body>
</html>
